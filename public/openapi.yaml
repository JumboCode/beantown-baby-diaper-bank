openapi: 3.0.0
info:
  title: Beantown Baby Diaper Bank API
  version: 1.0.0
  description: OpenAPI docs aligned with implemented Next.js API routes.
servers:
  - url: /api
    description: Internal API
paths:
  /partners:
    get:
      summary: List partners
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: waitlisted
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        '200':
          description: Partner list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerListItem'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create or update a partner
      description: |
        When the payload has no `id`, creates a new partner plus `PartnerRegion` rows.
        When the payload includes an `id`, updates partner details only (city percentages
        are managed via POST /partners/percentages).

        Accepts JSON or multipart/form-data. For multipart, include a `partner`
        JSON string field, optional `logoAction` (keep|replace|remove), and `file` when replacing.
        `logoAction` defaults to `keep`. `remove` is only valid on updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreatePartnerPayload'
                - $ref: '#/components/schemas/UpdatePartnerPayload'
          multipart/form-data:
            schema:
              type: object
              required: [partner]
              properties:
                partner:
                  type: string
                  description: JSON-serialized CreatePartnerPayload or UpdatePartnerPayload
                logoAction:
                  type: string
                  enum: [keep, replace, remove]
                  default: keep
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Partner created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PartnerRecord'
        '200':
          description: Partner updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PartnerRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Cities not found in database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /partners/{id}:
    get:
      summary: Get partner details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Partner details and aggregate distribution totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PartnerDetail'
        '404':
          description: Partner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Update partner by ID (legacy endpoint)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerIdRouteUpdatePayload'
      responses:
        '200':
          description: Updated partner
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PartnerRecord'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /partners/percentages:
    get:
      summary: List partner-region percentages
      parameters:
        - name: partnerId
          in: query
          schema:
            type: string
          description: BigInt-compatible string partner id
        - name: partnerName
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Partner region percentages. Returns empty array if partner not found by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerRegionItem'
        '500':
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
    post:
      summary: Replace all city-percentage allocations for a partner
      description: Percentages must sum to exactly 1. Fully replaces existing allocations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partnerId, percentages]
              properties:
                partnerId:
                  type: string
                  description: BigInt-compatible string partner id
                percentages:
                  type: array
                  items:
                    type: object
                    required: [city, percentage]
                    properties:
                      city:
                        type: string
                      percentage:
                        type: number
                        description: Must be between 0 and 1. All values must sum to 1.
      responses:
        '200':
          description: Percentages updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Continuous percentages updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Partner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /distributions:
    get:
      summary: Get distributions
      description: |
        Returns a bare array (not wrapped in `data`). Filter by single period or date range.
        For date range, all four range params (startYear, endYear, startMonth, endMonth) must be provided together.
      parameters:
        - name: month
          in: query
          schema:
            $ref: '#/components/schemas/MonthEnum'
        - name: year
          in: query
          schema:
            type: string
        - name: startMonth
          in: query
          schema:
            $ref: '#/components/schemas/MonthEnum'
        - name: startYear
          in: query
          schema:
            type: string
        - name: endMonth
          in: query
          schema:
            $ref: '#/components/schemas/MonthEnum'
        - name: endYear
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Distribution records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DistributionItem'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Replace monthly distributions for a partner/year/month combination
      description: |
        Fully replaces all distribution rows for the given (partnerId, year, month).
        Total diapers are sourced from the existing MonthlyData row and redistributed
        using the provided percentages. Percentages must sum to 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partnerId, month, year, percentages]
              properties:
                partnerId:
                  oneOf:
                    - type: string
                    - type: number
                month:
                  $ref: '#/components/schemas/MonthEnum'
                year:
                  type: integer
                percentages:
                  type: array
                  items:
                    type: object
                    required: [city, percentage]
                    properties:
                      city:
                        type: string
                      percentage:
                        type: number
      responses:
        '200':
          description: Distributions updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Distributions updated successfully
                  rowsCreated:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Set total diapers for a partner/year, distributing across cities by percentages
      description: |
        Replaces yearly (month=null) distribution rows for the partner.
        Allocates `numDiapers` across cities using their PartnerRegion percentages.
        Also updates YearlyData aggregate rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partnerId, year]
              properties:
                partnerId:
                  oneOf:
                    - type: string
                    - type: number
                year:
                  type: string
                numDiapers:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Yearly distributions updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Yearly distributions updated successfully
                  totalDiapers:
                    type: integer
                    nullable: true
                  distributions:
                    type: array
                    items:
                      $ref: '#/components/schemas/DistributionItem'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete distributions by IDs
      description: Also decrements related MonthlyData and YearlyData aggregate rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: BigInt-serialized distribution IDs
      responses:
        '200':
          description: Deletion count
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /distributions/upload:
    post:
      summary: Validate and upload distribution CSV data for a given month
      description: |
        If the target month already has data, existing rows are deleted before inserting.
        Returns validation errors before writing if any partner names are unknown, inactive, or waitlisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv, selectedDate]
              properties:
                csv:
                  type: string
                selectedDate:
                  type: string
                  description: ISO date string. Month and year are extracted from it.
      responses:
        '200':
          description: Upload processing result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '400':
          description: Validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: First error message
                  errors:
                    type: array
                    items:
                      type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  /distributions/validate:
    post:
      summary: Validate a distribution CSV without writing to the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv:
                  type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                required: [valid, errors]
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cities:
    get:
      summary: List cities with distributions and partner coverage
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Case-insensitive partial match
        - name: month
          in: query
          schema:
            $ref: '#/components/schemas/MonthEnum'
          description: Requires year to also be provided
        - name: year
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Cities data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CityItem'
    post:
      summary: Create a new city
      description: |
        Fetches centroid and boundary geometry from Nominatim and stores them.
        City must not already exist (case-insensitive check).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: City created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
        '400':
          description: Missing name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: City already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Geocoding failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cities/names:
    get:
      summary: Get a sorted list of all city names
      responses:
        '200':
          description: City names
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string

  /cities/centroids:
    get:
      summary: Get city centroids as GeoJSON FeatureCollection
      responses:
        '200':
          description: GeoJSON FeatureCollection of city centroids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollectionPoint'
        '404':
          description: No cities with centroid data found
          content:
            text/plain:
              schema:
                type: string
                example: City not found
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: Internal Server Error

  /cities/boundaries:
    get:
      summary: Get city boundaries as GeoJSON FeatureCollection
      responses:
        '200':
          description: GeoJSON FeatureCollection of city boundaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollectionPolygon'
        '404':
          description: No city boundary data found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /timeline-slider:
    get:
      summary: Get timeline years and months for which distribution data exists
      responses:
        '200':
          description: Timeline data. Returns empty arrays with a message when no data has been uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  years:
                    type: array
                    items:
                      type: string
                  months:
                    type: array
                    items:
                      type: object
                      properties:
                        Month:
                          $ref: '#/components/schemas/MonthEnum'
                        Year:
                          type: string
                  message:
                    type: string
                    description: Only present when no data has been uploaded
        '503':
          description: Database connection or query error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /total-diapers:
    get:
      summary: Get aggregate diaper totals
      description: |
        Without `year`: returns cumulative total across all time.
        With `year`: returns cumulative total through that year, the yearly total, and estimated babies helped.
      parameters:
        - name: year
          in: query
          schema:
            type: string
          description: If provided, also returns yearlyTotalDiapers and babiesHelped
      responses:
        '200':
          description: Diaper totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalDiapers:
                    type: integer
                    description: Cumulative total (through `year` if provided, all-time otherwise)
                  yearlyTotalDiapers:
                    type: integer
                    description: Total for the given year only. Present only when year param is provided.
                  babiesHelped:
                    type: integer
                    description: Estimated babies helped in the given year. Present only when year param is provided.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /monthly-data:
    get:
      summary: Get monthly data records
      description: |
        Returns a bare array (not wrapped in `data`). Filter by single period or date range.
        For date range, all four range params (startYear, endYear, startMonth, endMonth) must be provided together.
      parameters:
        - name: month
          in: query
          schema:
            $ref: '#/components/schemas/MonthEnum'
        - name: year
          in: query
          schema:
            type: string
        - name: startMonth
          in: query
          schema:
            $ref: '#/components/schemas/MonthEnum'
        - name: startYear
          in: query
          schema:
            type: string
        - name: endMonth
          in: query
          schema:
            $ref: '#/components/schemas/MonthEnum'
        - name: endYear
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Monthly data records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyDataItem'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create monthly data records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MonthlyDataCreateItem'
      responses:
        '201':
          description: Monthly data created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Monthly Data values created successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Upsert a monthly data row and recalculate downstream distributions
      description: |
        Creates or updates the MonthlyData row for (partnerId, year, month), then
        recalculates and replaces the corresponding Distribution rows and YearlyData aggregates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partnerId, year, month]
              properties:
                partnerId:
                  oneOf:
                    - type: string
                    - type: number
                year:
                  type: string
                month:
                  $ref: '#/components/schemas/MonthEnum'
                numDiapers:
                  oneOf:
                    - type: string
                    - type: number
                  nullable: true
                numBabies:
                  oneOf:
                    - type: string
                    - type: number
                  nullable: true
      responses:
        '200':
          description: Monthly data and recalculated distributions
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Monthly Data updated successfully
                  data:
                    $ref: '#/components/schemas/MonthlyDataItem'
                  distributions:
                    type: array
                    items:
                      $ref: '#/components/schemas/DistributionItem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /upload/logo:
    post:
      summary: Upload a partner logo to storage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  url:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/list:
    get:
      summary: List admin users from Clerk
      responses:
        '200':
          description: Admin users
          content:
            application/json:
              schema:
                type: object
                properties:
                  admins:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/add:
    post:
      summary: Create an admin user in Clerk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, level]
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                level:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Clerk validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    MonthEnum:
      type: string
      enum:
        - January
        - February
        - March
        - April
        - May
        - June
        - July
        - August
        - September
        - October
        - November
        - December

    StatusEnum:
      type: string
      enum:
        - active
        - waitlisted
        - inactive

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    PartnerRecord:
      description: Raw Prisma Partner record (BigInt fields serialized as strings)
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        address:
          type: string
          nullable: true
        coords:
          type: object
          nullable: true
          additionalProperties: true
        logoUrl:
          type: string
          nullable: true
        startPartner:
          type: string
          format: date-time
          nullable: true
        endPartner:
          type: string
          format: date-time
          nullable: true
        numBabies:
          type: string
          nullable: true
          description: BigInt serialized as string
        createdAt:
          type: string
          format: date-time

    PartnerListItem:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        start_partner:
          type: string
          format: date-time
          nullable: true
        end_partner:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        waitlisted:
          type: boolean
        address:
          type: string
          nullable: true
        coords:
          type: object
          nullable: true
          additionalProperties: true
        logoUrl:
          type: string
          nullable: true
        num_babies:
          type: integer
          nullable: true

    CreatePartnerPayload:
      type: object
      required: [name, description, status, coordinates, address, cities]
      properties:
        name:
          type: string
        description:
          type: string
        start_partner:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        coordinates:
          type: object
          additionalProperties: true
        address:
          type: string
        logo:
          type: string
        num_babies:
          type: integer
          nullable: true
        cities:
          type: array
          items:
            type: object
            required: [city, percentage]
            properties:
              city:
                type: string
              percentage:
                type: number

    UpdatePartnerPayload:
      type: object
      required: [id, name, description, status, coordinates, address]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        start_partner:
          type: string
          nullable: true
        end_partner:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        coordinates:
          type: object
          additionalProperties: true
        address:
          type: string
        logo:
          type: string
        num_babies:
          type: integer
          nullable: true

    PartnerIdRouteUpdatePayload:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        address:
          type: string
        coordinates:
          type: object
          additionalProperties: true
        logo:
          type: string
        start_partner:
          type: string
          nullable: true
