openapi: 3.0.3
info:
  title: Beantown Baby Diaper Bank API
  version: 1.0.1
  description: >
    OpenAPI specification for Beantown Baby Diaper Bank backend API.
    This API provides endpoints for public data access, admin data management, and authentication. Currently in the beginning stages of development. We are only working on the Public endpoints for the Hot Map UI, and a few of the Admin endpoints for data management.

servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://beantown-baby-diaper-bank.vercel.app/api
    description: Production server

tags:
  - name: Public
    description: Read-only endpoints used by the Hot Map UI
  - name: Admin
    description: Admin-only data management
  - name: Auth
    description: Authentication for admin view

paths:
  ############################
  # Public – Hot Map Reads  #
  ############################

  /cities:
    get:
      tags: [Public]
      summary: Lists all cities with active (not waitlisted) partner data and aggregated distribution data
      parameters:
        - name: year
          in: query
          required: false
          schema: { type: string }
          description: Filter distributions by year (e.g., "2024")
        - name: month
          in: query
          required: false
          schema: { type: string }
          description: Filter distributions by month (e.g., "March")
      responses:
        "200":
          description: Cities list with partners and totals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/City" }
        "400":
          description: Invalid year/month filter supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error while aggregating city data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cities/boundaries:
    get:
      tags: [Public]
      summary: List city boundaries only
      responses:
        "200":
          description: Cities list with only boundary GeoJSON field
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    boundary:
                      $ref: "#/components/schemas/GeoJSONPolygon"
        "404":
          description: No boundary data available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to load boundary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cities/centroids:
    get:
      tags: [Public]
      summary: List city centroids only
      parameters:
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Filter by city name (e.g., "Cambridge")
      responses:
        "200":
          description: Cities list with only centroid GeoJSON field
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    centroid:
                      $ref: "#/components/schemas/GeoJSONPoint"
        "404":
          description: No centroids matched the filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to load centroid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partners:
    get:
      tags: [Public]
      summary: List all partners with all details to be displayed in admin view
      responses:
        "200":
          description: Partner list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Partner" }
        "500":
          description: Failed to load partners
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partners/{id}:
    get:
      tags: [Public]
      summary: Get partner details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Partner details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
        "400":
          description: Partner ID must be a positive integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Partner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to load partner details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partners/percentages:
    get:
      tags: [Public]
      summary: Get list of partners and their percentages contributed to each city they serve.
      responses:
        "200":
          description: List of partners with percentages per city
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PartnerCityPercentage" }
        "404":
          description: No partner percentage data available for the provided filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to load partner percentage data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /timeline-slider:
    get:
      tags: [Public]
      summary: Gets years and months that have distribution data for timeline slider.
      responses:
        "200":
          description: List of years and months
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimelineSliderData" }
        "500":
          description: Failed to load timeline metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /total-diapers:
    get:
      tags: [Public]
      summary: Get total number of diapers distributed across all cities
      responses:
        "200":
          description: Total diapers distributed
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_diapers: { type: integer, example: 42630225 }
        "500":
          description: Failed to calculate total diapers distributed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  ############################
  # Admin – CRUD + Import   #
  ############################

  # TODO: Admin endpoints to be added in future sprints

  ############################
  # Auth – JWT (no DB req)  #
  ############################

  /auth/login:
    post:
      tags: [Auth]
      summary: Login as admin (returns JWT)
      description: >
        MVP: Validate against env-based single admin credentials.
        Future: swap to Users table without changing response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Auth tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate refresh token/cookie)
      responses:
        "204": { description: Logged out }

  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Get current admin profile
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ################
    # Public Types #
    ################
    City:
      description: City fields needed by the map
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        partners:
          type: array
          items: { $ref: "#/components/schemas/PartnerSimple" }
        num_diapers: { type: integer }
        num_babies: { type: integer }

    Partner:
      description: Matches Prisma model "Partner"
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        start_partner: { type: string, format: date }
        waitlisted: { type: boolean }
        address: { type: string }
        coords:
          type: object
          description: JSON field (lng/lat or structured)
        logo_url: { type: string }

    PartnerSimple:
      description: Simplified Partner for listing
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        logo_url: { type: string }

    PartnerCityPercentage:
      description: Partner with percentage contributed to a city
      type: object
      properties:
        partner_id: { type: integer }
        partner_name: { type: string }
        city_id: { type: integer }
        city_name: { type: string }
        percentage: { type: number }

    HotmapResponse:
      type: object
      properties:
        filters:
          type: object
          properties:
            year:
              type: string
              nullable: true
            month:
              type: string
              nullable: true
          description: Echoes the filters used to generate the response.
        data:
          type: array
          items:
            $ref: "#/components/schemas/HotmapDataPoint"
      required: [filters, data]

    HotmapDataPoint:
      description: Aggregated Hot Map data for a single city
      type: object
      properties:
        city_id: { type: integer }
        city_name: { type: string }
        centroid:
          allOf:
            - $ref: "#/components/schemas/GeoJSONPoint"
          description: GeoJSON Point representing the city centroid
        totals:
          $ref: "#/components/schemas/HotmapTotals"
        partner_markers:
          type: array
          description: Partner locations displayed alongside the city
          items:
            $ref: "#/components/schemas/HotmapPartnerMarker"
      required: [city_id, city_name, centroid, totals]

    HotmapTotals:
      description: Aggregated distribution metrics for a city
      type: object
      properties:
        diapers: { type: integer, example: 18450 }
        children: { type: integer, example: 163 }
      required: [diapers, children]

    HotmapPartnerMarker:
      description: Partner organization metadata surfaced on the top-level map
      type: object
      properties:
        partner_id: { type: integer }
        partner_name: { type: string }
        coords:
          allOf:
            - $ref: "#/components/schemas/GeoJSONPoint"
          description: GeoJSON Point for the partner location
        logo_url:
          type: string
          nullable: true
          description: Public URL for the partner logo, if available
      required: [partner_id, partner_name, coords]

    TimelineSliderData:
      description: Years and months with distribution data for timeline slider
      type: object
      properties:
        years:
          type: array
          items: { type: string }
        months:
          type: array
          items:
            type: object
            properties:
              Month: { type: string }
              Year: { type: string }

    ################
    # Shared Types #
    ################
    ErrorResponse:
      description: Standard error payload for invalid requests or server failures
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: "BAD_REQUEST" }
            message:
              {
                type: string,
                example: "Month must be one of: January, February, ...",
              }

    GeoJSONPoint:
      description: GeoJSON Point as defined by RFC 7946 (longitude, latitude, optional altitude)
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          minItems: 2
          items:
            type: number
          description: Position array ordered as [longitude, latitude, (optional) altitude]
      example:
        type: Point
        coordinates: [-71.0995, 42.3876]

    GeoJSONPolygon:
      description: GeoJSON Polygon following RFC 7946 (outer ring first, subsequent holes)
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          minItems: 1
          description: Array of linear rings; each ring has 4+ positions and is closed
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              items:
                type: number
      example:
        type: Polygon
        coordinates:
          - - [-71.11, 42.38]
            - [-71.10, 42.38]
            - [-71.10, 42.39]
            - [-71.11, 42.39]
            - [-71.11, 42.38]

    ################
    # Admin Types  #
    ################
    CityInput:
      description: Matches Prisma model "City"
      type: object
      required: [name, centroid]
      properties:
        name: { type: string }
        centroid:
          allOf:
            - $ref: "#/components/schemas/GeoJSONPoint"
          description: GeoJSON geometry(Point)
        boundary:
          allOf:
            - $ref: "#/components/schemas/GeoJSONPolygon"
          description: GeoJSON geography(Polygon) (optional in MVP)

    DistributionInput:
      description: Matches Prisma model "Distribution"
      type: object
      required: [partner_id, city_id, year, month, number_diapers]
      properties:
        partner_id: { type: integer }
        city_id: { type: integer }
        year: { type: string }
        month: { type: string }
        number_diapers: { type: integer }
        number_children: { type: integer }
        percentage: { type: number }

    DistributionPartial:
      description: All fields optional for PATCH/PUT updates
      type: object
      properties:
        partner_id: { type: integer }
        city_id: { type: integer }
        year: { type: string }
        month: { type: string }
        number_diapers: { type: integer }
        number_children: { type: integer }
        percentage: { type: number }

    PartnerPartial:
      description: All fields optional for PATCH/PUT updates
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        start_partner:
          type: string
          format: date
          description: Optional (maps to startPartner)
        waitlisted: { type: boolean }
        address: { type: string }
        coords:
          type: object
          description: JSON field (lng/lat or structured)
        logo_url: { type: string }

    PartnerInput:
      description: Matches Prisma model "Partner"
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        start_partner:
          type: string
          format: date
          description: Optional (maps to startPartner)
        waitlisted: { type: boolean }
        address: { type: string }
        coords:
          type: object
          description: JSON field (lng/lat or structure you decide)
        logo_url: { type: string }

    ################
    # Auth Types   #
    ################
    AuthTokens:
      type: object
      properties:
        access_token: { type: string }
        expires_in: { type: integer, example: 900, description: seconds }
        refresh_token: { type: string }
        token_type: { type: string, example: "Bearer" }

    AdminUser:
      type: object
      properties:
        email: { type: string, format: email }
        role: { type: string, example: "admin" }
